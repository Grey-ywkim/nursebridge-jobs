  document.getElementById("count").textContent=rows.length+"건"+(rows.length!==DATA.length?" / 전체 "+DATA.length+"건":"");
  document.getElementById("list").innerHTML=rows.length?rows.map(x=>'<a class="card" href="'+h(x.u)+'" target="_blank" rel="noopener"><div class="t">'+(x.n?'<span class="new">NEW</span>':'')+h(x.t)+'</div><div class="tags"><span>📍 '+h(x.a||x.r)+'</span>'+(x.j?'<span>'+h(x.j)+'</span>':'')+(x.c?'<span>'+h(x.c)+'</span>':'')+'<span class="dl">'+md(x.d)+'</span><span>'+h(x.s)+'</span></div></a>').join(""):'<p class="empty">조건에 맞는 공고가 없습니다.</p>';
}
chips("f-r","r","지역");chips("f-j","j","근무형태");chips("f-c","c","경력");
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
render();
</script>
</body>
</html>
